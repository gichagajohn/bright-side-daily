name: Bright Side Daily - Instagram Stories

on:
  schedule:
    # 07:30 EAT and 18:30 EAT — stories work best outside feed-post hours
    - cron: "30 4 * * *"
    - cron: "30 15 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bright-side-stories
  cancel-in-progress: false

jobs:
  stories:
    name: Publish Instagram Story
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Publish story
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          IG_SIGNATURE: ${{ secrets.IG_SIGNATURE }}
          DRY_RUN: "false"
        run: |
          python scripts/post_story.py

      - name: Upload story image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-${{ github.run_number }}
          path: images/output/stories/
          if-no-files-found: ignore
          retention-days: 7
