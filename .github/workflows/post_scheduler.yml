name: Bright Side Daily - Auto Poster

on:
  schedule:
    # All times are UTC.
    # Kenya/East Africa Time is UTC+3.

    - cron: "0 5 * * *"
      # 08:00 EAT - Morning Motivation

    - cron: "0 7 * * *"
      # 10:00 EAT - Positive Quote

    - cron: "0 9 * * *"
      # 12:00 EAT - Funny Meme

    - cron: "0 11 * * *"
      # 14:00 EAT - Self Improvement

    - cron: "0 13 * * *"
      # 16:00 EAT - Midday Encouragement

    - cron: "0 16 * * *"
      # 19:00 EAT - Evening Reflection

    - cron: "0 18 * * *"
      # 21:00 EAT - Engagement Question

  workflow_dispatch:
    inputs:
      slot:
        description: "Slot to post manually"
        required: false
        default: ""

      dry_run:
        description: "Set true to test without Facebook publishing"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: bright-side-daily-posting
  cancel-in-progress: false

jobs:
  post:
    name: Post to Facebook
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Determine posting slot
        id: slot_detect
        shell: bash
        run: |
          HOUR="$(date -u +%H)"
          INPUT_SLOT="${{ github.event.inputs.slot }}"

          if [ -n "$INPUT_SLOT" ]; then
            SLOT="$INPUT_SLOT"

          elif [ "$HOUR" = "05" ]; then
            SLOT="morning_motivation"

          elif [ "$HOUR" = "07" ]; then
            SLOT="positive_quote"

          elif [ "$HOUR" = "09" ]; then
            SLOT="funny_meme"

          elif [ "$HOUR" = "11" ]; then
            SLOT="self_improvement"

          elif [ "$HOUR" = "13" ]; then
            SLOT="midday_encouragement"

          elif [ "$HOUR" = "16" ]; then
            SLOT="evening_reflection"

          elif [ "$HOUR" = "18" ]; then
            SLOT="engagement_question"

          else
            SLOT="morning_motivation"
            echo "No matching hour. Using morning_motivation."
          fi

          echo "Selected slot: $SLOT"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"

      - name: Create environment file
        run: |
          cat > .env <<EOF
          FB_PAGE_ID=${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN=${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}
          DRY_RUN=${{ github.event.inputs.dry_run || 'false' }}
          EOF

      - name: Retry failed posts
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          python src/scheduler.py --retry-failed || true

      - name: Generate photo and publish
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          SLOT="${{ steps.slot_detect.outputs.slot }}"
          echo "Posting slot: $SLOT"
          python src/scheduler.py --slot "$SLOT"

      - name: Save state files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ content/ --force

          if ! git diff --staged --quiet; then
            git commit -m "chore: save Bright Side Daily state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi

      - name: Upload generated images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bright-side-images-${{ github.run_number }}
          path: images/output/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bright-side-logs-${{ github.run_number }}
          path: data/logs/
          if-no-files-found: ignore
          retention-days: 14
