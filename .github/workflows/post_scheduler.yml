name: Bright Side Daily - Facebook production
on:
  schedule:
    # UTC heartbeat; config/publishing.json determines local due slots, including DST.
    - cron: '0,30 * * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: Slot (auto selects currently due slots)
        type: choice
        default: auto
        options: [auto, morning_motivation, positive_quote, midday_encouragement, bible_world_encouragement, engagement_question, evening_reflection]
      dry_run:
        description: Render only; no Facebook or database writes
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: bright-side-facebook-production
  cancel-in-progress: false
jobs:
  publish:
    # Branch workflows cannot publish; manual previews work before merge.
    if: github.event_name == 'workflow_dispatch' || vars.BSD_ENABLE_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: facebook-production
    env:
      BSD_ENABLE_PUBLISH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.BSD_ENABLE_PUBLISH == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) && 'true' || 'false' }}
      BSD_ENABLE_REELS: ${{ vars.BSD_ENABLE_REELS || 'false' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      FB_API_VERSION: ${{ vars.FB_API_VERSION || 'v26.0' }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Skip idle heartbeats before installing media dependencies
        id: plan
        env:
          INPUT_SLOT: ${{ inputs.slot }}
        run: |
          if [ -n "$INPUT_SLOT" ] && [ "$INPUT_SLOT" != "auto" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            RESULT=$(PYTHONPATH=src python3 -c "from bsd.schedule import due; print('true' if due() else 'false')")
            echo "run=$RESULT" >> "$GITHUB_OUTPUT"
          fi
          echo "cache_day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.plan.outputs.run == 'true'
        with:
          python-version: '3.11'
          cache: pip
      - if: steps.plan.outputs.run == 'true'
        run: pip install --require-hashes -r requirements-v2.lock
      - if: steps.plan.outputs.run == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.plan.outputs.run == 'true'
        with:
          path: |
            .cache/bsd-footage
            ~/.cache/huggingface
          key: bsd-assets-v2-${{ steps.plan.outputs.cache_day }}
          restore-keys: bsd-assets-v2-
      - name: Render or publish due jobs
        if: steps.plan.outputs.run == 'true'
        env:
          INPUT_SLOT: ${{ inputs.slot }}
        run: |
          if [ -n "$INPUT_SLOT" ] && [ "$INPUT_SLOT" != "auto" ]; then
            python src/scheduler.py --slot "$INPUT_SLOT"
          else
            python src/scheduler.py --due
          fi
      - name: Review artifacts (no tokens or raw HTTP logs)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: facebook-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore
