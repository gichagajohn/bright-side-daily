name: Bright Side Daily - Facebook weekly intelligence
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bright-side-facebook-analytics
  cancel-in-progress: false
jobs:
  report:
    if: vars.BSD_ENABLE_ANALYTICS == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: facebook-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install --require-hashes -r requirements-v2.lock
      - name: Collect actual available Facebook metrics
        env:
          PYTHONPATH: src
          FB_API_VERSION: ${{ vars.FB_API_VERSION || 'v26.0' }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m bsd.analytics
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: facebook-weekly-${{ github.run_id }}
          path: artifacts/analytics/
          retention-days: 30
